# Netlify 部署配置
# 构建命令和发布目录

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# SPA 路由回退：所有路径都返回 index.html，避免刷新 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 安全头配置
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
